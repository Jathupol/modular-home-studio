# Deploy to Azure Web App (optional).
#
# ก่อนใช้งานให้ตั้งค่า 2 อย่างใน GitHub repo ของคุณ:
#   1) Settings > Secrets and variables > Actions > Variables
#        AZURE_WEBAPP_NAME = ชื่อ Web App จริงบน Azure
#   2) Settings > Secrets and variables > Actions > Secrets
#        AZURE_WEBAPP_PUBLISH_PROFILE = เนื้อหาไฟล์ Publish Profile จาก Azure Portal
#
# ถ้ายังไม่ได้ตั้งค่าทั้งสองอย่าง ขั้นตอน deploy จะถูกข้าม (workflow จะไม่ fail)

name: deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  NODE_VERSION: "20.x"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install and build
        run: |
          npm ci || npm install
          npm run build --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            .output
            package.json
            package-lock.json

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: "Development"
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Check Azure configuration
        id: cfg
        env:
          APP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          if [ -n "$APP_NAME" ] && [ -n "$PUBLISH_PROFILE" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ยังไม่ได้ตั้งค่า AZURE_WEBAPP_NAME (variable) และ AZURE_WEBAPP_PUBLISH_PROFILE (secret) — ข้ามขั้นตอน deploy"
          fi

      - name: Download artifact from build job
        if: steps.cfg.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Deploy to Azure WebApp
        id: deploy-to-webapp
        if: steps.cfg.outputs.ready == 'true'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
